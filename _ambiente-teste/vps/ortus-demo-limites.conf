# Ortus (demonstração): vai em /etc/nginx/conf.d/ (contexto http).
# Só define nomes com o prefixo ortusdemo_: nada aqui muda os outros sites.

# Registro sem a query string (o app manda telefone e caminho de arquivo nela).
log_format ortusdemo_sem_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent $request_time';

# Limite por visitante. A própria máquina fica de fora: o site chama os
# serviços falsos pelo endereço público e passaria a disputar o limite.
geo $ortusdemo_interno {
    default          0;
    127.0.0.0/8      1;
    10.0.0.0/8       1;
    144.22.246.90/32 1;
}
map $ortusdemo_interno $ortusdemo_chave {
    0 $binary_remote_addr;
    1 "";
}
limit_req_zone $ortusdemo_chave zone=ortusdemo:10m rate=30r/s;
