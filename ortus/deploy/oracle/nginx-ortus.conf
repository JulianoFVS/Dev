# Ortus — Nginx na frente do Next (127.0.0.1:3500), com HTTPS do Let's Encrypt.
#
# O Nginx inclui este arquivo dentro do bloco `http` (sites-enabled).
# Feito para o Nginx 1.24 do Ubuntu 24.04.
#
# Instalar trocando o domínio de exemplo pelo seu (veja docs/ORACLE.md):
#   sudo sed 's/ortus\.exemplo\.com\.br/<SEU_DOMINIO>/g' /opt/ortus/deploy/oracle/nginx-ortus.conf | sudo tee /etc/nginx/sites-available/ortus > /dev/null
#   sudo ln -sfn /etc/nginx/sites-available/ortus /etc/nginx/sites-enabled/ortus
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# O certificado tem que existir antes (certbot certonly): este arquivo aponta
# para ele e o Nginx não sobe se o arquivo do certificado faltar.
#
# Os cabeçalhos de segurança (HSTS, nosniff, X-Frame-Options, Referrer-Policy,
# Permissions-Policy) saem do próprio Next (next.config.ts). Não repita aqui:
# o navegador receberia cada um duas vezes.

# Registro de acesso sem a parte depois do "?". O app manda telefone de
# paciente e caminho de arquivo na query string (ex.: /api/whatsapp?...&telefone=)
# e isso não deve ficar em log.
log_format ortus_sem_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream ortus_next {
    server 127.0.0.1:3500;
    keepalive 16;
}

# Pedido que não é para o domínio do Ortus (IP direto, varredura): fecha a
# conexão sem responder e sem mostrar o certificado.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    ssl_protocols TLSv1.2 TLSv1.3;
}

# HTTP: só o desafio do Let's Encrypt e o redirecionamento para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name ortus.exemplo.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ortus.exemplo.com.br;

    ssl_certificate     /etc/letsencrypt/live/ortus.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ortus.exemplo.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ortus_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log /var/log/nginx/ortus.access.log ortus_sem_query;
    error_log  /var/log/nginx/ortus.error.log warn;

    # Maior corpo que o site aceita: arquivo enviado pelo WhatsApp, até
    # 4.200.000 caracteres em base64 dentro de um JSON
    # (ARQUIVO_MAXIMO_BASE64 em app/api/whatsapp/route.ts). Foto e documento de
    # paciente sobem direto do navegador para o R2 e não passam por aqui.
    # O padrão do Nginx (1m) recusaria o envio pelo WhatsApp.
    client_max_body_size 5m;

    # O Node lê "\" como "/" no caminho. Sem esta regra, "/api\local/db"
    # escaparia dos bloqueios abaixo e chegaria ao Next como "/api/local/db".
    # Nenhum endereço do app usa "\" (\x5c).
    location ~ \x5c {
        return 400;
    }

    # /api/local/* são as rotas do aplicativo desktop (banco local da clínica).
    # No site elas já respondem 404; aqui nem chegam ao Next.
    # A exceção é /api/local/status: toda tela consulta esse endereço para
    # saber se está dentro do aplicativo. A resposta fixa é a mesma informação
    # que o site daria (não é o aplicativo) e evita um 404 em cada carregamento.
    location = /api/local/status {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '{"desktop":false}';
    }

    location = /api/local {
        return 404;
    }

    location ^~ /api/local/ {
        return 404;
    }

    location / {
        proxy_pass http://ortus_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr e não $proxy_add_x_forwarded_for: o Nginx é a borda, e
        # o valor mandado pelo visitante não pode entrar na lista.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Folga para os cabeçalhos de resposta do Next (Link de pré-carga,
        # cookies). Com o buffer padrão de 4k, um cabeçalho maior vira 502
        # ("upstream sent too big header").
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 75s;
    }
}
