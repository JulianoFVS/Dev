# =====================================================================
# Ortus Desktop — configuração do electron-builder
#
# O instalador é NSIS para Windows x64. Dentro do .exe vão:
#   - o shell Electron (desktop/)
#   - o servidor Next autocontido (extraResources/app)
#   - o serviço do WhatsApp com node_modules próprio (extraResources/whatsapp)
#   - o Chromium do Puppeteer (extraResources/chromium)
#   - a configuração pública do Supabase (config.json)
#
# O que NÃO vai: SUPABASE_SERVICE_ROLE_KEY, DATABASE_URL e nenhum .env.
# Quem garante é o desktop/afterpack.cjs, que varre a pasta final com o
# scripts/desktop-verificar.mjs e derruba o build se achar segredo.
# =====================================================================

# Assinatura digital do Windows: calculada a partir do ambiente, na hora do
# build (ORTUS_ASSINATURA + segredos). Nada de certificado neste arquivo.
# O que este yml define vale por cima do que o arquivo-mãe devolve, então
# NÃO declare aqui `forceCodeSigning`, `win.signtoolOptions`,
# `win.azureSignOptions` nem `win.signExecutable`.
extends: desktop/assinatura.cjs

appId: br.com.ortus.desktop
productName: Ortus
copyright: Recode Systems

afterPack: desktop/afterpack.cjs

directories:
  output: dist-desktop
  buildResources: build

# Só o que o processo principal precisa. O Next já vai autocontido em
# extraResources/app, então não empacotamos o node_modules inteiro.
files:
  - 'desktop/**/*'
  - 'package.json'
  # O Next vai autocontido em extraResources/app, então o node_modules do app
  # não é necessário aqui — só o módulo nativo do SQLite.
  - '!node_modules/**/*'
  # better-sqlite3 v13 traz binários NAPI prontos para win32-x64/darwin/etc.
  - 'node_modules/better-sqlite3/**/*'
  - '!**/*.md'
  - '!**/*.map'

# Native modules precisam ficar fora do asar para o Node conseguir dlopen.
asar: true
asarUnpack:
  - 'node_modules/better-sqlite3/**/*'

extraResources:
  - from: .next/standalone
    to: app
    filter:
      - '**/*'
      - '!node_modules/**/*'
  # node_modules em entrada separada: o matcher do electron-builder ignora
  # node_modules quando está dentro de uma pasta copiada inteira.
  - from: .next/standalone/node_modules
    to: app/node_modules
  # Serviço do WhatsApp: server.mjs + lib + node_modules (whatsapp-web.js,
  # puppeteer, qrcode). Instale com `npm --prefix services/whatsapp ci`.
  - from: services/whatsapp
    to: whatsapp
    filter:
      - 'server.mjs'
      - 'package.json'
      - 'lib/**/*'
  # node_modules em entrada separada: o matcher do electron-builder ignora
  # node_modules quando está dentro de uma pasta copiada inteira.
  - from: services/whatsapp/node_modules
    to: whatsapp/node_modules
  - from: build/chromium
    to: chromium
    filter:
      - '**/*'
      - '!**/*.zip'
  - from: desktop/config.json
    to: config.json

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Ortus-Setup-${version}.${ext}
  # Ícone, nome e versão gravados no .exe. A assinatura em si vem de
  # desktop/assinatura.cjs (ver o comentário do `extends`, no topo).
  signAndEditExecutable: true

mac:
  category: public.app-category.medical
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: Ortus-${version}-${arch}.${ext}
  # Build não assinado (uso interno na clínica). Para distribuir fora,
  # configure identity + notarize com uma conta Apple Developer.
  hardenedRuntime: false
  gatekeeperAssess: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  artifactName: Ortus-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ortus
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerLanguages:
    - pt_BR
  language: '1046'

# Atualização automática fica desligada até existir canal assinado.
publish: null
